version: 2
before:
  hooks:
    - go mod tidy
env:
  - DOCKER_IMAGE_REPO={{ envOrDefault "DOCKER_IMAGE_REPO" "builder" }}

builds:
  - id: sparkles
    binary: sparkles
    main: main.go
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=1
    ldflags:
      - -s -w -X github.com/zeiss/builder/internal/versions.Version={{.Version}} -X github.com/zeiss/builder/internal/versions.Commit={{.Commit}} -X github.com/zeiss/builder/internal/versions.Date={{.Date}}
    overrides:
      - goos: darwin
        goarch: amd64
        env:
          - CGO_ENABLED=1
          - CC=clang
          - CXX=clang++
          - MACOSX_DEPLOYMENT_TARGET=12.0
          - CGO_CFLAGS=-mmacosx-version-min=12.0
          - CGO_LDFLAGS=-mmacosx-version-min=12.0
      - goos: darwin
        goarch: arm64
        env:
          - CGO_ENABLED=1
          - CC=clang
          - CXX=clang++
          - MACOSX_DEPLOYMENT_TARGET=12.0
          - CGO_CFLAGS=-mmacosx-version-min=12.0
          - CGO_LDFLAGS=-mmacosx-version-min=12.0
      - goos: linux
        goarch: amd64
        env:
          - CGO_ENABLED=1
          - CC=zig cc -target x86_64-linux-gnu.2.17
          - CXX=zig c++ -target x86_64-linux-gnu.2.17
      - goos: linux
        goarch: arm64
        env:
          - CGO_ENABLED=1
          - CC=zig cc -target aarch64-linux-gnu.2.17
          - CXX=zig c++ -target aarch64-linux-gnu.2.17

archives:
  - id: sparkles
    ids:
      - sparkles
    name_template: "sparkles_{{.Version}}_{{.Os}}_{{.Arch}}"

release:
  prerelease: auto
  mode: replace

changelog:
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: "Bug fixes"
      regexp: '^.*?bug(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - typo
      - (?i)foo

checksum:
  name_template: "sparkles_checksums.txt"
