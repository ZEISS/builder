# TODO: keep this until all references are updated.

# The base path of dex and the external name of the OpenID Connect service.
# This is the canonical URL that all clients MUST use to refer to dex. If a
# path is provided, dex's HTTP service will listen at a non-root URL.
issuer: http://builder.internal:5556/dex

# The storage configuration determines where dex stores its state. Supported
# options include SQL flavors and Kubernetes third party resources.
#
# See the documentation (https://dexidp.io/docs/storage/) for further information.
storage:
    type: sqlite3
    config:
      file: /etc/dex/dex.db

# Configuration for the HTTP endpoints.
web:
    http: 0.0.0.0:5556

# Configuration for telemetry
telemetry:
    http: 0.0.0.0:5558
    # enableProfiling: true

# Default values shown below
oauth2:
    # grantTypes determines the allowed set of authorization flows.
    grantTypes:
        - "authorization_code"
        - "client_credentials"
        - "refresh_token"
        #     - "implicit"
        #     - "password"
        - "urn:ietf:params:oauth:grant-type:device_code"
        - "urn:ietf:params:oauth:grant-type:token-exchange"

# Instead of reading from an external storage, use this list of clients.
#
# If this option isn't chosen clients may be added through the gRPC API.
staticClients:
    - id: example-app
      redirectURIs:
          - "http://builder.internal:3000/auth/dex/callback"
      postLogoutRedirectURIs:
          - "http://builder.internal:5555/"
      name: "Demo"
      secret: ZXhhbXBsZS1hcHAtc2VjcmV0

connectors:
    - type: github
      # Required field for connector id.
      id: github
      # Required field for connector name.
      name: GitHub
      config:
          # Required fields. Dex must be pre-registered with GitHub Enterprise
          # to get the following values.
          # Credentials can be string literals or pulled from the environment.
          clientID:
          clientSecret:
          redirectURI: http://builder.internal:5556/dex/callback

          # Flag which indicates that all the user's orgs and teams should be loaded.
          # Only works if neither 'org' nor 'orgs' are specified in the config.
          loadAllGroups: false

          # How the team names are formatted
          #  - Options: 'name' (default), 'slug', 'both'.
          #  - Examples:
          #    - 'name': 'acme:Site Reliability Engineers'
          #    - 'slug': 'acme:site-reliability-engineers'
          #    - 'both': 'acme:Site Reliability Engineers', 'acme:site-reliability-engineers'
          # teamNameField: slug

          # Required ONLY for GitHub Enterprise.
          # This is the Hostname of the GitHub Enterprise account listed on the
          # management console. Ensure this domain is routable on your network.
          hostName:

          # ONLY for GitHub Enterprise. Optional field.
          # Used to support self-signed or untrusted CA root certificates.
          # rootCA: /etc/dex/ca.crt

#  grantTypes:
#  - "authorization_code"
#  - "refresh_token"
