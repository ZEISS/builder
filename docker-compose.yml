services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: azurite
    networks:
      - builder
    ports:
      - "10000:10000"
    command: ["azurite", "--blobHost", "0.0.0.0", "--blobPort", "10000", "--skipApiVersionCheck"]

  postgres:
      image: postgres:17
      container_name: postgres
      networks:
        - builder
      ports:
        - "5432:5432"
      environment:
        - POSTGRES_USER=postgres
        - POSTGRES_PASSWORD=password
        - POSTGRES_DB=default
      volumes:
        - pg-data:/var/lib/postgresql/data
      healthcheck:
        test: [ "CMD-SHELL", "pg_isready -U postgres" ]
        interval: 5s
        timeout: 5s
        retries: 5

  dex:
    build:
      context: .
      dockerfile: Dockerfile.dex
    env_file:
      - .env
    depends_on:
      - postgres
    networks:
      - builder
    ports:
      - "5556:5556"
      - "5555:5555"
    volumes:
      - ./config-dex.yaml:/etc/dex/config.yaml
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    restart: unless-stopped

networks:
  builder:

volumes:
  pg-data:
  dex-data:
  azurite-data:
