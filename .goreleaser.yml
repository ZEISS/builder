version: 2
before:
  hooks:
    - go mod tidy
env:
  - DOCKER_IMAGE_REPO={{ envOrDefault "DOCKER_IMAGE_REPO" "builder" }}

builds:
  - id: sparkles
    binary: sparkles
    main: main.go
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=1
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    overrides:
      - goos: darwin
        goarch: amd64
        env:
          - CGO_ENABLED=1
          - CC=clang
          - CXX=clang++
          - MACOSX_DEPLOYMENT_TARGET=12.0
          - CGO_CFLAGS=-mmacosx-version-min=12.0
          - CGO_LDFLAGS=-mmacosx-version-min=12.0
      - goos: darwin
        goarch: arm64
        env:
          - CGO_ENABLED=1
          - CC=clang
          - CXX=clang++
          - MACOSX_DEPLOYMENT_TARGET=12.0
          - CGO_CFLAGS=-mmacosx-version-min=12.0
          - CGO_LDFLAGS=-mmacosx-version-min=12.0
      - goos: linux
        goarch: amd64
        env:
          - CGO_ENABLED=1
          - CC=zig cc -target x86_64-linux-gnu.2.17
          - CXX=zig c++ -target x86_64-linux-gnu.2.17
      - goos: linux
        goarch: arm64
        env:
          - CGO_ENABLED=1
          - CC=zig cc -target aarch64-linux-gnu.2.17
          - CXX=zig c++ -target aarch64-linux-gnu.2.17

archives:
  - id: sparkles
    ids:
      - sparkles
    name_template: "sparkles_{{.Version}}_{{.Os}}_{{.Arch}}"

homebrew_casks:
  - repository:
      owner: zeiss
      name: homebrew-builder-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/zeiss/builder
    description: A teeny-tiny tool to build stuff (deprecated)
    url:
      template: "https://github.com/zeiss/builder/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    directory: Casks
    name: builder
    ids:
      - sparkles
    binaries:
      - sparkles
    hooks:
      post:
        install_steps: |
          run "/usr/bin/mv", args: ["{{ "{{staged_path}}" }}/sparkles", "{{ "{{staged_path}}" }}/builder"]
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/sparkles"] if OS.mac?
        uninstall_steps: |
          remove "~/.local/share/sparkles" if OS.mac?
          remove "~/.local/share/sparkles" if OS.linux?
    license: APACHE-2.0
  - repository:
      owner: zeiss
      name: homebrew-builder-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/zeiss/builder
    description: A teeny-tiny tool to build stuff
    url:
      template: "https://github.com/zeiss/builder/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    directory: Casks
    name: sparkles
    ids:
      - sparkles
    binaries:
      - sparkles
    hooks:
      post:
        install_steps: |
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/sparkles"] if OS.mac?
        uninstall_steps: |
          remove "~/.local/share/sparkles" if OS.mac?
          remove "~/.local/share/sparkles" if OS.linux?
    license: APACHE-2.0

release:
  name_template: "v{{ .Version }}"
  header: |
    ## {{.Version}} Release ({{ .Date }})

    Welcome to this new release :rocket:!
  footer: |
    ## Thanks!

    Those were the changes on {{ .Tag }}!

changelog:
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: "Bug fixes"
      regexp: '^.*?bug(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - typo
      - (?i)foo

checksum:
  name_template: "sparkles_checksums.txt"
