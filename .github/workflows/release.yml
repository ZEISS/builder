# .github/workflows/release.yml

name: Release

on:
  push:
    tags:
      - "v*"
      - "!*nightly*"

env:
  DOCKER_IMAGE_REPO: ghcr.io/zeiss/builder
  TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}

jobs:
  test:
    permissions:
      checks: write
    uses: ./.github/workflows/main.yml

  sparkles:
    runs-on: macos-latest
    needs: [test]
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: ./go.mod
      - uses: mlugg/setup-zig@v2
      - run: make release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  server:
    runs-on: ubuntu-latest
    needs: [sparkles]
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: ./go.mod
      - uses: mlugg/setup-zig@v2
      - run: make release-server
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          go tool github.com/zeiss/pkg/cmd/helm/update --file helm/Chart.yaml --version ${{ github.ref_name }}
          go tool github.com/zeiss/pkg/cmd/helm/package --package-path tmp --path helm
          go tool github.com/zeiss/pkg/cmd/helm/release --package-path tmp --repo ${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }}
