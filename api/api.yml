components:
  schemas:
    CreateSiteInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/CreateSiteInputBody.json
          format: uri
          readOnly: true
          type: string
        name:
          description: The name of the site (e.g. fizzy-buzzy).
          example: fizzy-buzzy
          type: string
      required:
        - name
      type: object
    DeletedAt:
      additionalProperties: false
      properties:
        Time:
          format: date-time
          type: string
        Valid:
          type: boolean
      required:
        - Time
        - Valid
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          example: Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          nullable: true
          type: array
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          example: https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          example: 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          example: Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          example: https://example.com/errors/example
          format: uri
          type: string
      type: object
    GetSiteOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/GetSiteOutputBody.json
          format: uri
          readOnly: true
          type: string
        site:
          $ref: "#/components/schemas/Site"
      required:
        - site
      type: object
    ListOwnersOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/ListOwnersOutputBody.json
          format: uri
          readOnly: true
          type: string
        owners:
          items:
            $ref: "#/components/schemas/User"
          nullable: true
          type: array
      required:
        - owners
      type: object
    Permission:
      additionalProperties: false
      properties:
        CreatedAt:
          format: date-time
          type: string
        DeletedAt:
          $ref: "#/components/schemas/DeletedAt"
        Roles:
          items:
            $ref: "#/components/schemas/Role"
          nullable: true
          type: array
        UpdatedAt:
          format: date-time
          type: string
        description:
          nullable: true
          type: string
        id:
          format: int64
          minimum: 0
          type: integer
        scope:
          type: string
      required:
        - id
        - scope
        - description
        - Roles
        - CreatedAt
        - UpdatedAt
        - DeletedAt
      type: object
    Role:
      additionalProperties: false
      properties:
        CreatedAt:
          format: date-time
          type: string
        DeletedAt:
          $ref: "#/components/schemas/DeletedAt"
        Description:
          type: string
        ID:
          type: string
        Name:
          type: string
        Permissions:
          items:
            $ref: "#/components/schemas/Permission"
          nullable: true
          type: array
        UpdatedAt:
          format: date-time
          type: string
      required:
        - ID
        - Name
        - Description
        - Permissions
        - CreatedAt
        - UpdatedAt
        - DeletedAt
      type: object
    Site:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/Site.json
          format: uri
          readOnly: true
          type: string
        CreatedAt:
          format: date-time
          type: string
        DeletedAt:
          $ref: "#/components/schemas/DeletedAt"
        UpdatedAt:
          format: date-time
          type: string
        Users:
          items:
            $ref: "#/components/schemas/User"
          nullable: true
          type: array
        description:
          nullable: true
          type: string
        id:
          type: string
        name:
          type: string
        slug:
          type: string
      required:
        - id
        - name
        - slug
        - description
        - Users
        - CreatedAt
        - UpdatedAt
        - DeletedAt
      type: object
    User:
      additionalProperties: false
      properties:
        CreatedAt:
          format: date-time
          type: string
        DeletedAt:
          $ref: "#/components/schemas/DeletedAt"
        ID:
          type: string
        Roles:
          items:
            $ref: "#/components/schemas/Role"
          nullable: true
          type: array
        Sites:
          items:
            $ref: "#/components/schemas/Site"
          nullable: true
          type: array
        UpdatedAt:
          format: date-time
          type: string
        email:
          type: string
      required:
        - ID
        - email
        - Sites
        - Roles
        - CreatedAt
        - UpdatedAt
        - DeletedAt
      type: object
  securitySchemes:
    openid:
      bearerFormat: JWT
      flows:
        authorizationCode:
          scopes:
            email: ""
            offline_access: ""
            openid: ""
            profile: ""
          tokenUrl: ""
      in: header
      type: openIdConnect
info:
  title: Builder API
  version: 1.0.0
openapi: 3.0.3
paths:
  /site/{name}/owner:
    patch:
      description: Changes the owner of a site to the given email.
      operationId: patchSiteOwnedBy
      parameters:
        - description: The name of the site.
          in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The owner of the site has been updated.
        "400":
          description: The request was invalid.
        "401":
          description: Unauthorized.
        "403":
          description: Forbidden.
        "404":
          description: No site found.
        "500":
          description: An internal server error occurred.
      summary: Change the owner of a site
      tags:
        - Sites
  /sites:
    get:
      description: Gets a site by its name.
      operationId: getSite
      parameters:
        - description: The name of the site.
          in: query
          name: name
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetSiteOutputBody"
          description: The sites have been queried.
        "404":
          description: No site found.
        "500":
          description: An internal server error occurred.
      summary: Get a site
      tags:
        - Sites
    post:
      description: Creates a new site in the builder. This will create a new site folder.
      operationId: createSite
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSiteInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
          description: The site has been created.
        "400":
          description: The request was invalid.
        "409":
          description: The site already exists.
        "500":
          description: An internal server error occurred.
      summary: Create a new site
      tags:
        - Sites
  /sites/{name}/files/upload:
    post:
      description: Upload a new file to the site.
      operationId: uploadFile
      parameters:
        - description: The name of the site.
          example: fizzy-buzzy
          in: path
          name: name
          required: true
          schema:
            type: string
        - description: The name of the file.
          in: query
          name: fileName
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/octet-stream:
            schema:
              format: binary
              type: string
              x-contentMediaType: application/octet-stream
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                type: string
          description: The file was uploaded successfully.
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: This endpoint uploads a new file to the site.
      tags:
        - Sites
  /sites/{name}/owners:
    get:
      description: Lists the owners of a site by its name.
      operationId: listOwners
      parameters:
        - description: The name of the site.
          in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListOwnersOutputBody"
          description: The sites have been queried.
        "404":
          description: No site found.
        "500":
          description: An internal server error occurred.
      summary: List owners of a site
      tags:
        - Sites

