components:
  schemas:
    CreateSiteInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/CreateSiteInputBody.json
          format: uri
          readOnly: true
          type: string
        name:
          description: The name of the site (e.g. fizzy-buzzy).
          example: fizzy-buzzy
          type: string
      required:
        - name
      type: object
    DeletedAt:
      additionalProperties: false
      properties:
        Time:
          format: date-time
          type: string
        Valid:
          type: boolean
      required:
        - Time
        - Valid
      type: object
    GetSiteOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/GetSiteOutputBody.json
          format: uri
          readOnly: true
          type: string
        site:
          $ref: "#/components/schemas/Site"
      required:
        - site
      type: object
    Site:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/Site.json
          format: uri
          readOnly: true
          type: string
        createdAt:
          format: date-time
          type: string
        deletedAt:
          $ref: "#/components/schemas/DeletedAt"
        id:
          example: 6c785b65-e689-4653-ae78-81621226c48c
          type: string
        name:
          example: fizzy-buzzy
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - name
        - createdAt
        - updatedAt
        - deletedAt
      type: object
    UploadFileInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/UploadFileInputBody.json
          format: uri
          readOnly: true
          type: string
        content_type:
          description: The content type of the file.
          example: text/plain
          type: string
        file:
          description: The name of the site (e.g. fizzy-buzzy).
          example: fizzy-buzzy
          format: base64
          type: string
        name:
          description: The name of the site (e.g. fizzy-buzzy).
          example: fizzy-buzzy
          type: string
      required:
        - name
        - file
        - content_type
      type: object
  securitySchemes:
    openid:
      bearerFormat: JWT
      flows:
        authorizationCode:
          scopes:
            email: ""
            offline_access: ""
            openid: ""
            profile: ""
          tokenUrl: ""
      in: header
      type: openIdConnect
info:
  title: Builder API
  version: 1.0.0
openapi: 3.0.3
paths:
  /sites:
    get:
      description: Gets a site by its name.
      operationId: getSite
      parameters:
        - description: The name of the site.
          in: query
          name: name
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetSiteOutputBody"
          description: The sites have been queried.
        "404":
          description: No site found.
        "500":
          description: An internal server error occurred.
      summary: Get a site
      tags:
        - Sites
    post:
      description: Creates a new site in the builder. This will create a new site folder.
      operationId: createSite
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSiteInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
          description: The site has been created.
        "400":
          description: The request was invalid.
        "409":
          description: The site already exists.
        "500":
          description: An internal server error occurred.
      summary: Create a new site
      tags:
        - Sites
  /sites/{siteId}/files/upload:
    post:
      description: Upload a new file to the site.
      operationId: uploadFile
      parameters:
        - description: The ID of the site.
          example: 1bd3edd9-0310-4bca-b88a-2b16d8ca7116
          in: path
          name: siteId
          required: true
          schema:
            type: string
        - description: The name of the file.
          in: query
          name: fileName
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadFileInputBody"
          application/octet-stream:
            schema:
              format: binary
              type: string
              x-contentMediaType: application/octet-stream
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                type: string
          description: OK
        "201":
          description: The file was uploaded successfully.
      summary: This endpoint uploads a new file to the site.
      tags:
        - Sites

